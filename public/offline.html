<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DayMate</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #faf7f2; color: #1b2a41;
        font: 1.4rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; padding: 1.5rem; box-sizing: border-box; }
      main { max-width: 32rem; background: #fff; border: 1px solid #ddd5c8; border-radius: 20px; padding: 2rem 1.5rem; text-align: center; }
      h1 { font-size: 2rem; margin: 0 0 1rem; }
      button { min-height: 72px; padding: 0 2rem; border-radius: 16px; border: 0; background: #1f4e79; color: #fff; font: inherit; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>DayMate needs the internet</h1>
      <p>Please ask someone to check the Wi-Fi.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
